[package]
name = "kuzu"
version = "0.12.0"
description = "An in-process property graph database management system built for query speed and scalability"
keywords = ["database", "graph"]
license = "MIT"
categories = ["database"]

rust-version = "1.81"
edition = "2021"

[features]
default = ["native"]
native = ["kuzu-main", "kuzu-common"]

[dependencies]
kuzu-main = { path = "../../kuzu-core/kuzu-main", optional = true }
kuzu-common = { path = "../../kuzu-core/kuzu-common", optional = true }

# Legacy C++ FFI dependencies (used when native feature is disabled)
arrow = { version = "55", optional = true, default-features = false, features = ["ffi"] }
cxx = { version = "=1.0.138", optional = true }
rust_decimal = { version = "1.37", default-features = false, optional = true }
time = { version = "0.3", optional = true }
uuid = { version = "1.6", optional = true }

[build-dependencies]
cmake = { version = "0.1", optional = true }
cxx-build = { version = "=1.0.138", optional = true }
rustversion = { version = "1", optional = true }

[dev-dependencies]
anyhow = "1"
rust_decimal_macros = "1.37"
tempfile = "3"
time = { version = "0.3", features = ["macros"] }

[package.metadata.docs.rs]
all-features = true

[profile.relwithdebinfo]
inherits = "release"
debug = true

[lints.clippy]
cargo = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

complexity = { level = "warn", priority = -1 }
too_many_arguments = "allow"
type_complexity = "allow"

pedantic = { level = "warn", priority = -1 }
inline_always = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
redundant_closure_for_method_calls = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
unreadable_literal = "allow"
