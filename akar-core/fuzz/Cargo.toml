[package]
name = "akar-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
akar-main = { path = "../akar-main" }
akar-storage = { path = "../akar-storage" }
akar-common = { path = "../akar-common" }
tempfile = "3.8"

[[bin]]
name = "cypher_query"
path = "fuzz_targets/cypher_query.rs"
test = false
doc = false

[[bin]]
name = "expression_eval"
path = "fuzz_targets/expression_eval.rs"
test = false
doc = false

[[bin]]
name = "copy_from_csv"
path = "fuzz_targets/copy_from_csv.rs"
test = false
doc = false

[[bin]]
name = "wal_bytes"
path = "fuzz_targets/wal_bytes.rs"
test = false
doc = false

[[bin]]
name = "compression_roundtrip"
path = "fuzz_targets/compression_roundtrip.rs"
test = false
doc = false

[workspace]
