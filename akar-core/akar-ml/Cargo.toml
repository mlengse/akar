[package]
name = "akar-ml"
version = "0.1.20"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local ML inference and training for Akar (LSTM)"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
rand = "0.10"
fastembed = { version = "6", optional = true }
parking_lot = { version = "0.12", optional = true }
rayon = { workspace = true, optional = true }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["ndarray", "std", "api-24", "download-binaries", "tls-native"], optional = true }
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"], optional = true }
ndarray = { version = "0.17.2", default-features = false, optional = true }
thiserror.workspace = true
akar-common = { path = "../akar-common", version = "0.1.3", optional = true }
akar-function = { path = "../akar-function", version = "0.1.2", optional = true }
akar-extension = { path = "../akar-extension", version = "0.1.1", optional = true }

[features]
default = []
onnx-embedding = ["fastembed", "parking_lot", "rayon", "dep:ort", "dep:tokenizers", "dep:ndarray"]
extension = ["dep:akar-common", "dep:akar-function", "dep:akar-extension", "onnx-embedding"]

[dev-dependencies]
tempfile = "3"
akar-catalog = { path = "../akar-catalog", version = "0.1.1" }

[lints]
workspace = true
