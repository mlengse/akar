[package]
name = "akar-server"
version = "0.2.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Akar embedded server - multi-process access over TCP (P47)"
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[dependencies]
akar-main = { path = "../akar-main", version = "0.2.2" }
akar-common = { path = "../akar-common", version = "0.2.2" }
akar-dream = { path = "../akar-dream", version = "0.2.2" }
akar-ml = { path = "../akar-ml", version = "0.2.2" }
arrow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3"

[features]
default = []
embed = ["akar-dream/embed"]
ml-extension = ["embed", "akar-main/ml-extension"]
json-extension = ["akar-main/json-extension"]
fts-extension = ["akar-main/fts-extension"]
vector-extension = ["akar-main/vector-extension"]
parquet-export = ["akar-main/parquet-export"]
full = ["embed", "ml-extension", "json-extension", "fts-extension", "vector-extension", "parquet-export"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
