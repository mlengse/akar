[package]
name = "akar-server"
version = "0.1.20"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Akar embedded server - multi-process access over TCP (P47)"
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[dependencies]
akar-main = { path = "../akar-main", version = "0.1.7" }
akar-common = { path = "../akar-common", version = "0.1.3" }
akar-dream = { path = "../akar-dream", version = "0.1.18" }
akar-ml = { path = "../akar-ml", version = "0.1.20" }
arrow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3"

[features]
default = []
embed = ["akar-dream/embed"]
ml-extension = ["embed", "akar-main/ml-extension"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
