[package]
name = "akar-iceberg"
version = "0.1.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Apache Iceberg extension for the Akar embedded graph database"
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[dependencies]
arrow.workspace = true
akar-common = { path = "../akar-common", version = "0.1.3" }
akar-function = { path = "../akar-function", version = "0.1.2" }
akar-extension = { path = "../akar-extension", version = "0.1.1" }
akar-duckdb = { path = "../akar-duckdb", version = "0.1.3" }
flate2 = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[features]
default = []
duckdb-delegation = ["akar-duckdb/bundled"]
native = ["dep:flate2"]

[lints]
workspace = true
