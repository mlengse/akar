[package]
name = "akar-azure"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Azure storage extension for the Akar embedded graph database"
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[dependencies]
arrow.workspace = true
akar-common = { path = "../akar-common", version = "0.1.0" }
akar-function = { path = "../akar-function", version = "0.1.0" }
akar-extension = { path = "../akar-extension", version = "0.1.0" }
akar-duckdb = { path = "../akar-duckdb", version = "0.1.0", optional = true }
ureq = "3.3.0"
tempfile = "3.10"
tracing.workspace = true

[features]
default = []
duckdb-delegation = ["akar-duckdb/bundled"]
native = []

[lints]
workspace = true
