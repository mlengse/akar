[workspace]
resolver = "2"
members = [
    "akar-search",
    "akar-dream",
    "akar-common",
    "akar-storage",
    "akar-transaction",
    "akar-catalog",
    "akar-parser",
    "akar-binder",
    "akar-planner",
    "akar-optimizer",
    "akar-processor",
    "akar-function",
    "akar-graph",
    "akar-extension",
    "akar-json",
    "akar-fts",
    "akar-vector",
    "akar-httpfs",
    "akar-duckdb",
    "akar-algo",
    "akar-neo4j",
    "akar-llm",
    "akar-sqlite",
    "akar-delta",
    "akar-iceberg",
    "akar-azure",
    "akar-postgres",
    "akar-unity-catalog",
    "akar-ml",
    "akar-main",
    "akar-cli", "akar-wasm", "akar-migrate", "akar-c",
    "akar-server",
]

[workspace.package]
version = "0.1.15"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/mlengse/akar"
description = "Akar — pure Rust embedded graph database for AI agent memory"
keywords = ["graph", "database", "embedded", "cypher", "ai-agent"]
categories = ["database", "database-implementations"]
authors = ["Anjang Kusuma Netra"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"
rayon = "1"
regex = "1"
hashbrown = { version = "0.17.1", features = ["serde"] }
ahash = "0.8"
bytes = "1"
criterion = { version = "0.8.2", features = ["html_reports"] }
arrow = { version = "59.1.0", default-features = false, features = ["csv", "ipc", "prettyprint"] }
parquet = { version = "59.1.0", default-features = false, features = ["arrow", "flate2", "flate2-rust_backend", "snap", "brotli", "lz4"] }
flate2 = { version = "1.0", features = ["rust_backend"] }
csv = "1.3"
ureq = "3"
time = "0.3.47"
md-5 = "0.11.0"
sha2 = "0.11.0"
base64 = "0.23"
crc32fast = "1"
indicatif = "0.18"

[workspace.lints.clippy]
needless_range_loop = "allow"
too_many_arguments = "allow"
empty_line_after_doc_comments = "allow"
len_without_is_empty = "allow"
if_same_then_else = "allow"
clone_on_copy = "allow"
items_after_test_module = "allow"
match_like_matches_macro = "allow"
type_complexity = "allow"
collapsible_match = "allow"
collapsible_if = "allow"
cloned_ref_to_slice_refs = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.release-debug]
inherits = "release"
opt-level = 3
debug = true
strip = false

[profile.dev]
debug = 1

[profile.test]
debug = 1

[profile.bench]
debug = true
