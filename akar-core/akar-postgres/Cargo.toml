[package]
name = "akar-postgres"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "PostgreSQL extension for the Akar embedded graph database"
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[dependencies]
akar-function = { path = "../akar-function" }
akar-extension = { path = "../akar-extension" }
tokio = { version = "1", features = ["rt", "rt-multi-thread"], optional = true }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"], optional = true }
tracing.workspace = true

[features]
default = []
native = ["tokio", "tokio-postgres"]

[dev-dependencies]
akar-catalog = { path = "../akar-catalog" }
akar-common = { path = "../akar-common" }
akar-extension = { path = "../akar-extension" }

[lints]
workspace = true
