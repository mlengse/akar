[package]
name = "akar-storage"
version = "0.1.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Storage engine for the Akar embedded graph database"
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[features]
default = ["parquet"]
parquet = ["dep:arrow", "dep:parquet"]

[dependencies]
akar-common = { path = "../akar-common", version = "0.1.0" }
akar-catalog = { path = "../akar-catalog", version = "0.1.0" }
akar-transaction = { path = "../akar-transaction", version = "0.1.0" }
akar-vector = { path = "../akar-vector", version = "0.1.0" }
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
hashbrown.workspace = true
bytes.workspace = true
csv.workspace = true
arrow = { workspace = true, optional = true }
parquet = { workspace = true, optional = true }
flate2 = { workspace = true }
dashmap = "6"
memmap2 = "0.9"
crc32fast = "1"

[dev-dependencies]
tempfile = "3"
criterion.workspace = true

[[bench]]
name = "hybrid_eval"
harness = false

[lints]
workspace = true
