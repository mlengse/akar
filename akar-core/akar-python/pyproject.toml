[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "akar"
version = "0.1.0"
description = "Akar — pure Rust embedded graph database for AI agent memory (Python bindings)"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
dependencies = []

[tool.maturin]
module-name = "akar"
manifest-path = "Cargo.toml"
