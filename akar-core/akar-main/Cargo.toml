[package]
name = "akar-main"
version = "0.1.16"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Akar - pure Rust embedded graph database for AI agent memory"
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[features]
default = []
adbc = ["dep:arrow"]
parquet-export = ["dep:arrow", "dep:parquet"]
json-extension = ["dep:akar-json"]
fts-extension = ["dep:akar-fts"]
vector-extension = ["dep:akar-vector"]
httpfs-extension = ["dep:akar-httpfs"]
duckdb-extension = ["dep:akar-duckdb"]
algo-extension = ["dep:akar-algo"]
neo4j-extension = ["dep:akar-neo4j"]
llm-extension = ["dep:akar-llm"]
sqlite-extension = ["dep:akar-sqlite"]
delta-extension = ["dep:akar-delta"]
delta-native = ["dep:akar-delta", "akar-delta/native"]
iceberg-extension = ["dep:akar-iceberg"]
iceberg-native = ["dep:akar-iceberg", "akar-iceberg/native"]
azure-extension = ["dep:akar-azure"]
azure-native = ["dep:akar-azure", "akar-azure/native"]
postgres-extension = ["dep:akar-postgres"]
unity-catalog-extension = ["dep:akar-unity-catalog"]
unity-catalog-native = ["dep:akar-unity-catalog", "akar-unity-catalog/native"]

[dependencies]
akar-common = { path = "../akar-common", version = "0.1.3" }
akar-storage = { path = "../akar-storage", version = "0.1.7" }
akar-transaction = { path = "../akar-transaction", version = "0.1.1" }
akar-catalog = { path = "../akar-catalog", version = "0.1.1" }
akar-parser = { path = "../akar-parser", version = "0.1.2" }
akar-binder = { path = "../akar-binder", version = "0.1.5" }
akar-planner = { path = "../akar-planner", version = "0.1.5" }
akar-optimizer = { path = "../akar-optimizer", version = "0.1.4" }
akar-processor = { path = "../akar-processor", version = "0.1.5" }
akar-function = { path = "../akar-function", version = "0.1.2" }
akar-extension = { path = "../akar-extension", version = "0.1.1" }
akar-json = { path = "../akar-json", version = "0.1.2", optional = true }
akar-fts = { path = "../akar-fts", version = "0.1.1", optional = true }
akar-vector = { path = "../akar-vector", version = "0.1.3", optional = true }
akar-httpfs = { path = "../akar-httpfs", version = "0.1.2", optional = true }
akar-duckdb = { path = "../akar-duckdb", version = "0.1.3", optional = true }
akar-algo = { path = "../akar-algo", version = "0.1.6", optional = true }
akar-neo4j = { path = "../akar-neo4j", version = "0.1.2", optional = true }
akar-llm = { path = "../akar-llm", version = "0.1.2", optional = true }
akar-sqlite = { path = "../akar-sqlite", version = "0.1.2", optional = true }
akar-delta = { path = "../akar-delta", version = "0.1.3", optional = true }
akar-iceberg = { path = "../akar-iceberg", version = "0.1.3", optional = true }
akar-azure = { path = "../akar-azure", version = "0.1.3", optional = true }
akar-postgres = { path = "../akar-postgres", version = "0.1.3", optional = true }
akar-unity-catalog = { path = "../akar-unity-catalog", version = "0.1.3", optional = true }
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
arrow = { workspace = true, optional = true }
parquet = { workspace = true, optional = true }
csv.workspace = true
tempfile = "3"

[dev-dependencies]
tempfile = "3"
parquet = "59.1.0"
proptest = "1.6"
arrow = { workspace = true }
criterion.workspace = true

[[bench]]
name = "query_pipeline"
harness = false

[[bench]]
name = "storage_bench"
harness = false

[[bench]]
name = "ladybug_suite"
harness = false

[[bench]]
name = "storage_io_bench"
harness = false

[[bench]]
name = "recovery_time_bench"
harness = false

[lints]
workspace = true
