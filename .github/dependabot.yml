# Dependabot — automated dependency updates for Kuzu Core
#
# Keeps Rust crate dependencies up to date with weekly PRs.
# Groups patch/minor updates together to reduce noise.

version: 2
updates:
  # ── Rust workspace (kuzu-core) ──
  - package-ecosystem: "cargo"
    directory: "/kuzu-core"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Jakarta"
    # Group all non-major updates into a single PR
    groups:
      cargo-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
      cargo-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
    # Major updates get individual PRs for review
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    assignees:
      - "anjan"
    # Ignore known-problematic updates
    ignore:
      # Skip arrow major bumps (tightly coupled to ADBC interface)
      - dependency-name: "arrow"
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions ──
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Jakarta"
    labels:
      - "dependencies"
      - "ci"
