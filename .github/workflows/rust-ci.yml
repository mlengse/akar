# Rust CI — Kuzu Core Workspace
#
# Builds, tests, and lints the kuzu-core Rust workspace on push and PR.
# Runs on Ubuntu, macOS, and Windows plus WASM and feature-gated checks.

name: Rust CI

on:
  push:
    branches: [master, main]
    paths:
      - 'kuzu-core/**'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'kuzu-core/**'
      - '.github/workflows/rust-ci.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  # ══════════════════════════════════════════════════════
  # Formatting check
  # ══════════════════════════════════════════════════════
  fmt:
    name: cargo fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
        working-directory: kuzu-core

  # ══════════════════════════════════════════════════════
  # Clippy lint check
  # ══════════════════════════════════════════════════════
  clippy:
    name: cargo clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: kuzu-core

  # ══════════════════════════════════════════════════════
  # Build & Test — Ubuntu
  # ══════════════════════════════════════════════════════
  test-ubuntu:
    name: test (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build --workspace
        working-directory: kuzu-core
      - run: cargo test --workspace --no-fail-fast
        working-directory: kuzu-core

  # ══════════════════════════════════════════════════════
  # Build & Test — macOS
  # ══════════════════════════════════════════════════════
  test-macos:
    name: test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build --workspace
        working-directory: kuzu-core
      - run: cargo test --workspace --no-fail-fast
        working-directory: kuzu-core

  # ══════════════════════════════════════════════════════
  # Build & Test — Windows (MSVC)
  # ══════════════════════════════════════════════════════
  test-windows:
    name: test (windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build --workspace
        working-directory: kuzu-core
      - run: cargo test --workspace --no-fail-fast
        working-directory: kuzu-core

  # ══════════════════════════════════════════════════════
  # Feature-gated build — all extensions enabled
  # ══════════════════════════════════════════════════════
  feature-gated:
    name: build (all features)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build with all extension features
        run: |
          cargo build -p kuzu-main \
            --features json-extension,fts-extension,vector-extension,httpfs-extension,duckdb-extension,algo-extension,neo4j-extension,llm-extension,sqlite-extension,delta-extension,adbc
          cargo build -p kuzu-cli
        working-directory: kuzu-core
      - name: Test with all features
        run: |
          cargo test -p kuzu-main \
            --features json-extension,fts-extension,vector-extension,httpfs-extension,duckdb-extension,algo-extension,neo4j-extension,llm-extension,sqlite-extension,delta-extension,adbc \
            --no-fail-fast
          cargo test -p kuzu-json -p kuzu-fts -p kuzu-vector -p kuzu-algo \
            --no-fail-fast
        working-directory: kuzu-core

  # ══════════════════════════════════════════════════════
  # WASM target check (no runtime tests — wasm32 target)
  # ══════════════════════════════════════════════════════
  wasm-check:
    name: check (wasm32)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - name: Check WASM target
        run: |
          cargo check --workspace --target wasm32-unknown-unknown \
            --exclude kuzu-httpfs \
            --exclude kuzu-duckdb \
            --exclude kuzu-sqlite \
            --exclude kuzu-postgres \
            --exclude kuzu-neo4j \
            --exclude kuzu-delta \
            --exclude kuzu-iceberg \
            --exclude kuzu-azure \
            --exclude kuzu-unity-catalog \
            --exclude kuzu-wasm
          cargo check -p kuzu-wasm --target wasm32-unknown-unknown
        working-directory: kuzu-core

  # ══════════════════════════════════════════════════════
  # Benchmark compilation check (does not run benchmarks)
  # ══════════════════════════════════════════════════════
  bench-check:
    name: check (benchmarks compile)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo bench --workspace --no-run
        working-directory: kuzu-core

  # ══════════════════════════════════════════════════════
  # Code coverage (cargo-tarpaulin)
  # ══════════════════════════════════════════════════════
  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin --version 0.31.5
      - name: Run coverage
        run: |
          cargo tarpaulin --workspace \
            --out Html \
            --out Xml \
            --output-dir target/coverage \
            --exclude-files 'tests/*' \
            --exclude-files 'benches/*'
        working-directory: kuzu-core
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: kuzu-core/target/coverage/cobertura.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ──────────────────────────────────────────────────────
  # WASM compatibility check
  # ──────────────────────────────────────────────────────
  wasm:
    name: wasm check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - run: cargo check --target wasm32-unknown-unknown --workspace
        working-directory: kuzu-core

  # ──────────────────────────────────────────────────────
  # tools/rust_api native build
  # ──────────────────────────────────────────────────────
  rust-api:
    name: rust-api (native)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build native kuzu crate
        run: cargo check
        working-directory: tools/rust_api
