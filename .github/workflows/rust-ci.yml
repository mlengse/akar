# Rust CI — Akar Core Workspace
#
# Builds, tests, and lints the akar-core Rust workspace on push and PR.
# Runs on Ubuntu, macOS, and Windows plus WASM and feature-gated checks.

name: Rust CI

on:
  push:
    branches: [master, main]
    paths:
      - 'akar-core/**'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'akar-core/**'
      - '.github/workflows/rust-ci.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  # ══════════════════════════════════════════════════════
  # Formatting check
  # ══════════════════════════════════════════════════════
  fmt:
    name: cargo fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
        working-directory: akar-core

  # ══════════════════════════════════════════════════════
  # Security audit
  # ══════════════════════════════════════════════════════
  audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: rustsec/audit-check@v2.0.0
        with:
          working-directory: akar-core

  # ══════════════════════════════════════════════════════
  # Clippy lint check
  # ══════════════════════════════════════════════════════
  clippy:
    name: cargo clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: akar-core
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: akar-core

  # ══════════════════════════════════════════════════════
  # Build & Test — Ubuntu
  # ══════════════════════════════════════════════════════
  test-ubuntu:
    name: test (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: akar-core
      - run: cargo build --workspace
        working-directory: akar-core
      - run: cargo test --workspace --no-fail-fast
        working-directory: akar-core

  # ══════════════════════════════════════════════════════
  # Build & Test — macOS
  # ══════════════════════════════════════════════════════
  test-macos:
    name: test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: akar-core
      - run: cargo build --workspace
        working-directory: akar-core
      - run: cargo test --workspace --no-fail-fast
        working-directory: akar-core

  # ══════════════════════════════════════════════════════
  # Build & Test — Windows (MSVC)
  # ══════════════════════════════════════════════════════
  test-windows:
    name: test (windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: akar-core
      - run: cargo build --workspace
        working-directory: akar-core
      - run: cargo test --workspace --no-fail-fast
        working-directory: akar-core

  # ══════════════════════════════════════════════════════
  # Feature-gated build — all extensions enabled
  # ══════════════════════════════════════════════════════
  feature-gated:
    name: build (all features)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build with all extension features
        run: |
          cargo build -p akar-main \
            --features json-extension,fts-extension,vector-extension,httpfs-extension,duckdb-extension,algo-extension,neo4j-extension,llm-extension,sqlite-extension,delta-extension,adbc
          cargo build -p akar-cli
        working-directory: akar-core
      - name: Test with all features
        run: |
          cargo test -p akar-main \
            --features json-extension,fts-extension,vector-extension,httpfs-extension,duckdb-extension,algo-extension,neo4j-extension,llm-extension,sqlite-extension,delta-extension,adbc \
            --no-fail-fast
          cargo test -p akar-json -p akar-fts -p akar-vector -p akar-algo \
            --no-fail-fast
        working-directory: akar-core

  # ══════════════════════════════════════════════════════
  # WASM target check (no runtime tests — wasm32 target)
  # ══════════════════════════════════════════════════════
  wasm-check:
    name: check (wasm32)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - name: Check WASM target
        run: |
          cargo check --workspace --target wasm32-unknown-unknown \
            --exclude akar-httpfs \
            --exclude akar-duckdb \
            --exclude akar-sqlite \
            --exclude akar-postgres \
            --exclude akar-neo4j \
            --exclude akar-delta \
            --exclude akar-iceberg \
            --exclude akar-azure \
            --exclude akar-unity-catalog \
            --exclude akar-wasm
          cargo check -p akar-wasm --target wasm32-unknown-unknown
        working-directory: akar-core

  # ══════════════════════════════════════════════════════
  # Benchmark compilation check (does not run benchmarks)
  # ══════════════════════════════════════════════════════
  bench-check:
    name: check (benchmarks compile)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo bench --workspace --no-run
        working-directory: akar-core

  # ══════════════════════════════════════════════════════
  # Code coverage (cargo-tarpaulin)
  # ══════════════════════════════════════════════════════
  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin --version 0.31.5
      - name: Run coverage
        run: |
          cargo tarpaulin --workspace \
            --out Html \
            --out Xml \
            --output-dir target/coverage \
            --exclude-files 'tests/*' \
            --exclude-files 'benches/*'
        working-directory: akar-core
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: akar-core/target/coverage/cobertura.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ──────────────────────────────────────────────────────
  # WASM runtime tests via wasm-pack (Node.js target)
  # ──────────────────────────────────────────────────────
  wasm-test:
    name: wasm test (node)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack
      - name: Run WASM tests in Node.js
        run: wasm-pack test --node akar-wasm
        working-directory: akar-core

  # ──────────────────────────────────────────────────────
  # tools/rust_api native build
  # ──────────────────────────────────────────────────────
  rust-api:
    name: rust-api (native)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build native akar crate
        run: cargo check
        working-directory: tools/rust_api
