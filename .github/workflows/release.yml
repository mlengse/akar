name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            asset_name: kuzu-linux-amd64
            artifact_name: kuzu-linux
          - os: macos-latest
            asset_name: kuzu-macos-amd64
            artifact_name: kuzu-macos
          - os: windows-latest
            asset_name: kuzu-windows-amd64.exe
            artifact_name: kuzu-windows.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build CLI
        working-directory: kuzu-core
        run: cargo build --release -p kuzu-cli

      - name: Prepare Asset (Unix)
        if: runner.os != 'Windows'
        run: |
          cp kuzu-core/target/release/kuzu-cli ${{ matrix.artifact_name }}

      - name: Prepare Asset (Windows)
        if: runner.os == 'Windows'
        run: |
          copy kuzu-core\target\release\kuzu-cli.exe ${{ matrix.artifact_name }}

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ matrix.artifact_name }}
          asset_name: ${{ matrix.asset_name }}
          tag: ${{ github.ref }}
          overwrite: true
