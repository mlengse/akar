# PyPI Release - akar Python bindings (akar-core/akar-python)
#
# MANUAL ONLY (workflow_dispatch) — deliberately NOT triggered by git tag
# push (v*).
#
# Reason: the `v*` tag is shared by the RUST release path (crates.io +
# rust-release.yml → GitHub Release/CLI binaries). PyPI wheels are built with
# maturin and published with twine (pypa/gh-action-pypi-publish) using
# secrets.PYPI_TOKEN — a separate artifact owned by the Python package, not
# the Rust crates. Auto-triggering off `v*` would publish every Rust release
# to PyPI without anyone asking for it. Run this job explicitly when you want
# to cut a Python wheel release.
#
# This is what lets kairos users `pip install akar>=0.1.14` WITHOUT building
# the Rust crates themselves. Keep it in sync with:
#   - akar-core/akar-python/Cargo.toml   (crate version / deps)
#   - akar-core/akar-python/pyproject.toml (maturin config / wheel metadata)

name: PyPI Release (akar wheels)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build + test wheels without uploading to PyPI'
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  # abi3-py39 is set in akar-python (pyo3 feature) so a single wheel covers
  # CPython >= 3.9.

jobs:
  # ────────────────────────────────────────────────────────────────
  # Build + smoke-test the wheel (ubuntu-24.04 host, manylinux x86_64)
  # ────────────────────────────────────────────────────────────────
  build:
    name: build manylinux wheel + smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install maturin
        run: python -m pip install --upgrade pip maturin
      - name: Build wheel
        working-directory: akar-core/akar-python
        env:
          PYO3_PYTHON: python
        run: maturin build --release --out ../../dist
      - name: Smoke test the wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python akar-core/akar-python/smoke_test.py
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels
          path: dist/*.whl

  # ────────────────────────────────────────────────────────────────
  # Publish the wheel to PyPI (manual dispatch; skipped on dry-run)
  # ────────────────────────────────────────────────────────────────
  publish:
    name: publish to PyPI
    needs: [build]
    runs-on: ubuntu-24.04
    if: ${{ !inputs.dry_run }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Check wheel
        run: |
          ls -la dist
          COUNT=$(ls dist/*.whl | wc -l)
          if [ "$COUNT" -lt 1 ]; then echo "expected >=1 wheel, got $COUNT"; exit 1; fi
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: dist/
          skip-existing: true
