# Rust Release — Akar Core Workspace
#
# Triggered by git tag push (v*) or manual workflow dispatch.
# 1. Runs full test suite
# 2. Builds CLI binaries for Linux, macOS, Windows
# 3. Creates GitHub Release with binaries + auto-generated changelog
#
# NOTE: crates.io publishing is DEFERRED per Design Decision #11
# (akar-core/implementation_plan.md). All internal crates have
# `publish = false` and are path dependencies of akar-main/akar-cli.
# Publishing to crates.io requires either publishing all internal
# crates first or consolidating into a single crate — deferred until
# API stabilises.

name: Rust Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (run tests + build without creating release)'
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ──────────────────────────────────────────────────────
  # Test all crates before any build/release
  # ──────────────────────────────────────────────────────
  test:
    name: cargo test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test --workspace --no-fail-fast
        working-directory: akar-core

  # ──────────────────────────────────────────────────────
  # Build CLI binaries for distribution
  # ──────────────────────────────────────────────────────
  build-cli:
    name: build CLI (${{ matrix.os }})
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset_name: akar-cli-linux-amd64
          - os: macos-14
            target: aarch64-apple-darwin
            asset_name: akar-cli-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: akar-cli-windows-amd64.exe
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: rustup target add ${{ matrix.target }}
        if: matrix.target != 'x86_64-unknown-linux-gnu'
      - name: Build release binary
        working-directory: akar-core
        run: cargo build --release --target ${{ matrix.target }} -p akar-cli
      - name: Prepare asset
        run: |
          cp akar-core/target/${{ matrix.target }}/release/akar-cli${{ runner.os == 'Windows' && '.exe' || '' }} ${{ matrix.asset_name }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  # ──────────────────────────────────────────────────────
  # Create GitHub Release with binaries (tag push only)
  # ──────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    needs: [build-cli]
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate changelog
        id: changelog
        run: |
          echo "## Release ${{ github.ref_name }}" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "### Changes since previous release" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          git log --oneline --no-decorate $(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD >> CHANGELOG.md || true
      - name: Download all binaries
        uses: actions/download-artifact@v7
        with:
          path: binaries
          merge-multiple: true
      - name: Create Release with assets
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: binaries/*
          draft: false
          prerelease: false

  # ──────────────────────────────────────────────────────
  # Dry-run (manual dispatch only) — runs tests + builds
  # without publishing or creating a release
  # ──────────────────────────────────────────────────────
  dry-run:
    name: Dry Run (tests + build only)
    needs: [test]
    runs-on: ubuntu-24.04
    if: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build release (verify compilation)
        run: cargo build --release -p akar-cli
        working-directory: akar-core
      - name: Verify no warnings
        run: cargo clippy --release -p akar-cli 2>&1 || true
        working-directory: akar-core
