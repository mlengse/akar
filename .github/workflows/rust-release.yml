# Rust Release — Kuzu Core Workspace
#
# Publishes kuzu-main and kuzu-cli to crates.io on version tags.
# Triggered by git tag push (v*) or manual workflow dispatch.
#
# Dependency publication order (required because kuzu-main depends on
# internal crates via path dependencies):
#   1. Core crates (kuzu-common → kuzu-storage → ...)
#   2. kuzu-main
#   3. kuzu-cli
#
# Note: As of v0.1.0, internal crates are marked `publish = false`.
# To publish all dependencies, remove that flag and publish in order.

name: Rust Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (check without publishing)'
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ──────────────────────────────────────────────────────
  # Test all crates before any publish
  # ──────────────────────────────────────────────────────
  test:
    name: cargo test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test --workspace --no-fail-fast
        working-directory: kuzu-core

  # ──────────────────────────────────────────────────────
  # Publish kuzu-main to crates.io
  # ──────────────────────────────────────────────────────
  publish-kuzu-main:
    name: publish kuzu-main
    needs: [test]
    runs-on: ubuntu-24.04
    if: ${{ !inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Publish kuzu-main
        run: cargo publish -p kuzu-main
        working-directory: kuzu-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ──────────────────────────────────────────────────────
  # Publish kuzu-cli to crates.io
  # ──────────────────────────────────────────────────────
  publish-kuzu-cli:
    name: publish kuzu-cli
    needs: [test]
    runs-on: ubuntu-24.04
    if: ${{ !inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Publish kuzu-cli
        run: cargo publish -p kuzu-cli
        working-directory: kuzu-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ──────────────────────────────────────────────────────
  # Create GitHub Release (tag push only, not manual)
  # ──────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    needs: [publish-kuzu-main]
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate changelog
        id: changelog
        run: |
          echo "## Release ${{ github.ref_name }}" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          git log --oneline --no-decorate $(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD >> CHANGELOG.md || true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false

  # ──────────────────────────────────────────────────────
  # Dry-run check (manual dispatch with dry_run=true)
  # ──────────────────────────────────────────────────────
  dry-run:
    name: cargo publish --dry-run
    needs: [test]
    runs-on: ubuntu-24.04
    if: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Dry-run publish kuzu-main
        run: cargo publish --dry-run -p kuzu-main 2>&1 || true
        working-directory: kuzu-core
      - name: Dry-run publish kuzu-cli
        run: cargo publish --dry-run -p kuzu-cli 2>&1 || true
        working-directory: kuzu-core
