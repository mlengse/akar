# Rust Release — Kuzu Core Workspace
#
# Triggered by git tag push (v*) or manual workflow dispatch.
# 1. Tests all crates
# 2. Publishes kuzu-main and kuzu-cli to crates.io
# 3. Builds CLI binaries for Linux, macOS, Windows
# 4. Creates GitHub Release with binaries + changelog

name: Rust Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (check without publishing)'
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ──────────────────────────────────────────────────────
  # Test all crates before any publish/build
  # ──────────────────────────────────────────────────────
  test:
    name: cargo test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test --workspace --no-fail-fast
        working-directory: kuzu-core

  # ──────────────────────────────────────────────────────
  # Build CLI binaries for distribution
  # ──────────────────────────────────────────────────────
  build-cli:
    name: build CLI (${{ matrix.os }})
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset_name: kuzu-cli-linux-amd64
          - os: macos-14
            target: aarch64-apple-darwin
            asset_name: kuzu-cli-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: kuzu-cli-windows-amd64.exe
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: rustup target add ${{ matrix.target }}
        if: matrix.target != 'x86_64-unknown-linux-gnu'
      - name: Build release binary
        working-directory: kuzu-core
        run: cargo build --release --target ${{ matrix.target }} -p kuzu-cli
      - name: Prepare asset
        run: |
          cp kuzu-core/target/${{ matrix.target }}/release/kuzu-cli${{ runner.os == 'Windows' && '.exe' || '' }} ${{ matrix.asset_name }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  # ──────────────────────────────────────────────────────
  # Publish kuzu-main to crates.io
  # ──────────────────────────────────────────────────────
  publish-kuzu-main:
    name: publish kuzu-main
    needs: [test]
    runs-on: ubuntu-24.04
    if: ${{ !inputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Publish kuzu-main
        run: cargo publish -p kuzu-main
        working-directory: kuzu-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ──────────────────────────────────────────────────────
  # Publish kuzu-cli to crates.io
  # ──────────────────────────────────────────────────────
  publish-kuzu-cli:
    name: publish kuzu-cli
    needs: [test]
    runs-on: ubuntu-24.04
    if: ${{ !inputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Publish kuzu-cli
        run: cargo publish -p kuzu-cli
        working-directory: kuzu-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ──────────────────────────────────────────────────────
  # Create GitHub Release with binaries (tag push only)
  # ──────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    needs: [publish-kuzu-main, build-cli]
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Generate changelog
        id: changelog
        run: |
          echo "## Release ${{ github.ref_name }}" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          git log --oneline --no-decorate $(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD >> CHANGELOG.md || true
      - name: Download all binaries
        uses: actions/download-artifact@v7
        with:
          path: binaries
          merge-multiple: true
      - name: Create Release with assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: binaries/*
          draft: false
          prerelease: false

  # ──────────────────────────────────────────────────────
  # Dry-run check (manual dispatch with dry_run=true)
  # ──────────────────────────────────────────────────────
  dry-run:
    name: cargo publish --dry-run
    needs: [test]
    runs-on: ubuntu-24.04
    if: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Dry-run publish kuzu-main
        run: cargo publish --dry-run -p kuzu-main 2>&1 || true
        working-directory: kuzu-core
      - name: Dry-run publish kuzu-cli
        run: cargo publish --dry-run -p kuzu-cli 2>&1 || true
        working-directory: kuzu-core
