[package]
name = "kuzu-main"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
adbc = ["dep:arrow"]
parquet-export = ["dep:arrow", "dep:parquet"]
json-extension = ["dep:kuzu-json"]
fts-extension = ["dep:kuzu-fts"]
vector-extension = ["dep:kuzu-vector"]
httpfs-extension = ["dep:kuzu-httpfs"]
duckdb-extension = ["dep:kuzu-duckdb"]
algo-extension = ["dep:kuzu-algo"]
neo4j-extension = ["dep:kuzu-neo4j"]
llm-extension = ["dep:kuzu-llm"]
sqlite-extension = ["dep:kuzu-sqlite"]
delta-extension = ["dep:kuzu-delta"]
delta-native = ["dep:kuzu-delta", "kuzu-delta/native"]
iceberg-extension = ["dep:kuzu-iceberg"]
iceberg-native = ["dep:kuzu-iceberg", "kuzu-iceberg/native"]
azure-extension = ["dep:kuzu-azure"]
azure-native = ["dep:kuzu-azure", "kuzu-azure/native"]
postgres-extension = ["dep:kuzu-postgres"]
unity-catalog-extension = ["dep:kuzu-unity-catalog"]
unity-catalog-native = ["dep:kuzu-unity-catalog", "kuzu-unity-catalog/native"]

[dependencies]
kuzu-common = { path = "../kuzu-common" }
kuzu-storage = { path = "../kuzu-storage" }
kuzu-transaction = { path = "../kuzu-transaction" }
kuzu-catalog = { path = "../kuzu-catalog" }
kuzu-parser = { path = "../kuzu-parser" }
kuzu-binder = { path = "../kuzu-binder" }
kuzu-planner = { path = "../kuzu-planner" }
kuzu-optimizer = { path = "../kuzu-optimizer" }
kuzu-processor = { path = "../kuzu-processor" }
kuzu-function = { path = "../kuzu-function" }
kuzu-extension = { path = "../kuzu-extension" }
kuzu-json = { path = "../kuzu-json", optional = true }
kuzu-fts = { path = "../kuzu-fts", optional = true }
kuzu-vector = { path = "../kuzu-vector", optional = true }
kuzu-httpfs = { path = "../kuzu-httpfs", optional = true }
kuzu-duckdb = { path = "../kuzu-duckdb", optional = true }
kuzu-algo = { path = "../kuzu-algo", optional = true }
kuzu-neo4j = { path = "../kuzu-neo4j", optional = true }
kuzu-llm = { path = "../kuzu-llm", optional = true }
kuzu-sqlite = { path = "../kuzu-sqlite", optional = true }
kuzu-delta = { path = "../kuzu-delta", optional = true }
kuzu-iceberg = { path = "../kuzu-iceberg", optional = true }
kuzu-azure = { path = "../kuzu-azure", optional = true }
kuzu-postgres = { path = "../kuzu-postgres", optional = true }
kuzu-unity-catalog = { path = "../kuzu-unity-catalog", optional = true }
tracing.workspace = true
arrow = { workspace = true, optional = true }
parquet = { workspace = true, optional = true }
csv.workspace = true

[dev-dependencies]
tempfile = "3"
parquet = "59.1.0"
proptest = "1.6"
arrow = { workspace = true }
criterion.workspace = true

[[bench]]
name = "query_pipeline"
harness = false

[[bench]]
name = "storage_bench"
harness = false

[[bench]]
name = "ladybug_suite"
harness = false

[lints]
workspace = true
