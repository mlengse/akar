[workspace]
resolver = "2"
members = [
    "kuzu-common",
    "kuzu-storage",
    "kuzu-transaction",
    "kuzu-catalog",
    "kuzu-parser",
    "kuzu-binder",
    "kuzu-planner",
    "kuzu-optimizer",
    "kuzu-processor",
    "kuzu-function",
    "kuzu-graph",
    "kuzu-extension",
    "kuzu-main",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/kuzudb/kuzu"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"
rayon = "1"
regex = "1"
hashbrown = "0.15"
bitflags = "2"
bytes = "1"
uuid = "1"
time = "0.3"
rust_decimal = "1"
fast-float = "0.2"
