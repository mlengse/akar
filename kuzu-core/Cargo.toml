[workspace]
resolver = "2"
members = [
    "kuzu-common",
    "kuzu-storage",
    "kuzu-transaction",
    "kuzu-catalog",
    "kuzu-parser",
    "kuzu-binder",
    "kuzu-planner",
    "kuzu-optimizer",
    "kuzu-processor",
    "kuzu-function",
    "kuzu-graph",
    "kuzu-extension",
    "kuzu-json",
    "kuzu-fts",
    "kuzu-vector",
    "kuzu-httpfs",
    "kuzu-duckdb",
    "kuzu-algo",
    "kuzu-neo4j",
    "kuzu-llm",
    "kuzu-sqlite",
    "kuzu-delta",
    "kuzu-iceberg",
    "kuzu-azure",
    "kuzu-postgres",
    "kuzu-unity-catalog",
    "kuzu-main",
    "kuzu-cli", "kuzu-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/kuzudb/kuzu"
description = "Kùzu graph database — pure Rust embedded graph database"
keywords = ["graph", "database", "embedded", "cypher", "graph-database"]
categories = ["database", "database::implementations"]
authors = ["Kuzu Contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"
rayon = "1"
regex = "1"
hashbrown = "0.17"
bitflags = "2"
bytes = "1"
criterion = { version = "0.5", features = ["html_reports"] }
arrow = { version = "53", default-features = false, features = ["csv", "ipc", "prettyprint"] }
parquet = { version = "53", default-features = false, features = ["arrow", "flate2", "snap", "brotli", "lz4"] }
csv = "1.3"
uuid = "1"
ureq = "3"
time = "0.3.47"
rust_decimal = "1"
md-5 = "0.10"
sha2 = "0.10"

[workspace.lints.clippy]
needless_range_loop = "allow"
too_many_arguments = "allow"
empty_line_after_doc_comments = "allow"
len_without_is_empty = "allow"
if_same_then_else = "allow"
clone_on_copy = "allow"
items_after_test_module = "allow"
match_like_matches_macro = "allow"
type_complexity = "allow"
collapsible_match = "allow"
collapsible_if = "allow"
cloned_ref_to_slice_refs = "allow"
