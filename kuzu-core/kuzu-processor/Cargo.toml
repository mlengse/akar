[package]
name = "kuzu-processor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["parquet"]
parquet = ["kuzu-storage/parquet"]

[dependencies]
kuzu-common = { path = "../kuzu-common" }
kuzu-catalog = { path = "../kuzu-catalog" }
kuzu-planner = { path = "../kuzu-planner" }
kuzu-function = { path = "../kuzu-function" }
kuzu-storage = { path = "../kuzu-storage" }
kuzu-parser = { path = "../kuzu-parser" }
kuzu-fts = { path = "../kuzu-fts" }
tracing.workspace = true
hashbrown.workspace = true
rayon.workspace = true
arrow.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "physical_scan"
harness = false

[[bench]]
name = "physical_filter"
harness = false

[[bench]]
name = "physical_hash_join"
harness = false

[[bench]]
name = "physical_order_by"
harness = false

[[bench]]
name = "physical_aggregate"
harness = false

[[bench]]
name = "evaluate_arrow"
harness = false

[lints]
workspace = true

